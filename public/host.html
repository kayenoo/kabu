<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>КАБУ · экран ведущего</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffcf5a;--red:#e0283c}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 30%,#5c0d16,#1a0507 75%) fixed;color:#fff;font:18px/1.4 Inter,system-ui,sans-serif}
button{font:700 18px Inter,sans-serif;min-height:52px;padding:0 26px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
button:disabled{opacity:.35;cursor:default}.pri{background:#fff;color:#2a060b;border-color:#fff}
main{max-width:1400px;margin:0 auto;padding:clamp(20px,3vw,44px)}
h1{font:900 clamp(48px,7vw,96px)/1 Unbounded,sans-serif;margin:0}
.lobby{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:clamp(24px,4vw,60px);align-items:start}
.join{background:#fff;color:#1a0507;border-radius:28px;padding:24px;text-align:center;width:min(380px,80vw)}
.join img{width:100%;aspect-ratio:1;display:block}
.join .url{font:600 16px Inter;margin-top:10px;word-break:break-all}
.pin{font:900 clamp(56px,6vw,84px)/1 Unbounded;letter-spacing:.06em;margin:6px 0 0}
.lbl{font-size:14px;opacity:.6;text-transform:none}
.count{font:700 26px Unbounded;margin:18px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.chip{background:rgba(255,255,255,.1);border-radius:999px;padding:10px 18px;font-weight:600;animation:pop .3s}
.chip.off{opacity:.4}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tb{background:rgba(0,0,0,.28);border-radius:20px;padding:18px;border:2px solid transparent}
.tb.end{border-color:var(--gold)}
.tb h3{font:700 20px Unbounded;margin:0 0 4px}.tb .st{font-size:14px;opacity:.7;margin-bottom:10px}
.tb ol{margin:0;padding:0;list-style:none}.tb li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.tb li b{font-variant-numeric:tabular-nums}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:start}
.lead{background:rgba(0,0,0,.28);border-radius:20px;padding:18px;width:min(340px,90vw)}
.lead h3{font:700 18px Unbounded;margin:0 0 10px}
.mini{display:flex;gap:14px;align-items:center;background:#fff;color:#1a0507;border-radius:16px;padding:10px 14px;margin-top:16px}
.mini img{width:90px;height:90px}.mini b{font:900 30px Unbounded}
@media(max-width:820px){.lobby,.top{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"><h1>КАБУ</h1><p>Подключение…</p></main>
<script src="/socket.io/socket.io.js"></script>
<script>
{
const sock=io(),app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let H=null,saved={};try{saved=JSON.parse(localStorage.getItem('kabuHost')||'{}')}catch(e){}
sock.on('connect',()=>sock.emit('host:create',saved,r=>{saved=r;try{localStorage.setItem('kabuHost',JSON.stringify(r))}catch(e){}}));
sock.on('host',h=>{H=h;render()});
const joinUrl=()=>location.origin+'/?pin='+H.pin;
const qr=()=>'/qr.svg?u='+encodeURIComponent(joinUrl());
function render(){
  const on=H.players.filter(p=>p.online);
  if(H.state==='lobby'){
    app.innerHTML=`<div class="lobby"><div class="join"><img src="${qr()}" alt="QR для входа"><div class="lbl">PIN игры</div><div class="pin">${H.pin}</div><div class="url">${esc(joinUrl())}</div></div>
    <div><h1>КАБУ</h1><p style="opacity:.75;max-width:40ch">Сканируй QR, вводи имя — и жди. Когда все зайдут, раскидаем вас по столам по 3–4 человека.</p>
    <div class="count">Игроков: ${on.length}</div>
    <div class="chips">${H.players.map(p=>`<span class="chip${p.online?'':' off'}">${esc(p.name)}</span>`).join('')||'<span style="opacity:.5">Пока никого</span>'}</div>
    <div class="bar"><button class="pri" data-a="start" ${on.length<2?'disabled':''}>Начать и раскидать по столам</button><button data-a="new">Новая игра (новый PIN)</button></div></div></div>`;
  }else{
    const all=H.tables.flatMap(t=>t.members.map(m=>({...m,t:t.no}))).sort((a,b)=>a.total-b.total);
    const wait=H.players.filter(p=>p.table==null&&p.online);
    app.innerHTML=`<div class="top"><div><h1 style="font-size:clamp(36px,4vw,56px)">КАБУ · ${H.tables.length} ${H.tables.length===1?'стол':'стола(ов)'}</h1>
    <div class="bar"><button data-a="lobby">Вернуть всех в лобби и перераспределить</button>${wait.length?`<span style="opacity:.7">Ждут следующего распределения: ${wait.map(p=>esc(p.name)).join(', ')}</span>`:''}</div>
    <div class="tables">${H.tables.map(t=>`<div class="tb${t.phase==='end'?' end':''}"><h3>Стол ${t.no}</h3><div class="st">Раунд ${t.round} · ${t.phase==='peek'?'смотрят карты':t.phase==='end'?'вскрытие':'ходит '+esc(t.cur)}${t.caboBy?' · КАБУ: '+esc(t.caboBy):''}</div>
      <ol>${t.members.map(m=>`<li><span>${esc(m.name)}${m.online?'':' (офлайн)'}</span><b>${m.total}</b></li>`).join('')}</ol></div>`).join('')}</div></div>
    <div><div class="lead"><h3>Лидеры (меньше — лучше)</h3><ol style="margin:0;padding-left:22px">${all.slice(0,10).map(m=>`<li>${esc(m.name)} · <b>${m.total}</b> <span style="opacity:.5">стол ${m.t}</span></li>`).join('')}</ol></div>
    <div class="mini"><img src="${qr()}" alt=""><div><div class="lbl">Опоздал? PIN</div><b>${H.pin}</b></div></div></div></div>`;
  }
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==='start')sock.emit('host:start');
  if(a==='lobby')sock.emit('host:lobby');
  if(a==='new'){saved={};sock.emit('host:create',{},r=>{saved=r;try{localStorage.setItem('kabuHost',JSON.stringify(r))}catch(e){}})}
});
}
</script>
</body>
</html>
